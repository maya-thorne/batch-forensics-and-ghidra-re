<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="box1G" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0c121d"/>
    </linearGradient>
    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="940" height="380" rx="12" fill="url(#bgG)"/>
  <rect x="0.5" y="0.5" width="939" height="379" rx="11.5" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Title & Subtitle -->
  <text x="470" y="36" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">
    batch-forensics-and-ghidra-re : Arquitectura del Pipeline
  </text>
  <text x="470" y="58" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    Disección Forense de Tres Capas, Simulación de Parser y Marco de Detección
  </text>

  <!-- 3 Big Tier Boxes -->
  <!-- Box 1: Input -->
  <g transform="translate(35, 82)">
    <rect width="270" height="260" rx="8" fill="url(#box1G)" stroke="#334155" stroke-width="1.2"/>
    <rect width="270" height="34" rx="8" fill="#1e293b"/>
    <rect y="26" width="270" height="8" fill="#1e293b"/>
    <text x="135" y="22" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      1. ENTRADA DE OFUSCACIÓN Y EMPAQUETADO
    </text>

    <g transform="translate(14, 54)" font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="0" font-weight="bold" fill="#fde68a">&bull; Invoke-DOSfuscation (Slicing de variables PowerShell)</text>
      <text x="0" y="50" font-weight="bold" fill="#fde68a">&bull; BatCloak / BEncoder (Disfraz de BOM UTF-16LE)</text>
      <text x="0" y="100" font-weight="bold" fill="#fde68a">&bull; SomalifuscatorV2 / 0xidiz3r (César / Cero Literales)</text>
      <text x="0" y="150" font-weight="bold" fill="#fde68a">&bull; Compiladores Bat2Exe (UPX, VB6, .NET CLR, Bytepress)</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(312, 202)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="20,-5 28,0 20,5" fill="#38bdf8"/>
  </g>

  <!-- Box 2: Analysis -->
  <g transform="translate(335, 82)">
    <rect width="270" height="260" rx="8" fill="url(#box1G)" stroke="#0284c7" stroke-width="1.5" filter="url(#boxGlow)"/>
    <rect width="270" height="34" rx="8" fill="#075985"/>
    <rect y="26" width="270" height="8" fill="#075985"/>
    <text x="135" y="22" text-anchor="middle" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      2. INGENIERÍA INVERSA GHIDRA Y SIMULACIÓN AST
    </text>

    <g transform="translate(14, 54)" font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="0" font-weight="bold" fill="#38bdf8">&bull; Triage Ghidra PE (bat2exe_12, BEDeCode, example.exe)</text>
      <text x="0" y="50" font-weight="bold" fill="#38bdf8">&bull; Fase 1: Verificación de BOM y Codificación Políglota</text>
      <text x="0" y="100" font-weight="bold" fill="#38bdf8">&bull; Fase 2: Máquina de Estados Lexer de Caret (IN_QUOTES)</text>
      <text x="0" y="150" font-weight="bold" fill="#38bdf8">&bull; Fases 3-5: Slicing (%VAR:~o,l%), Delimitadores y !VAR!</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(612, 202)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#10b981" stroke-width="2.5"/>
    <polygon points="20,-5 28,0 20,5" fill="#10b981"/>
  </g>

  <!-- Box 3: Detection -->
  <g transform="translate(635, 82)">
    <rect width="270" height="260" rx="8" fill="url(#box1G)" stroke="#059669" stroke-width="1.5"/>
    <rect width="270" height="34" rx="8" fill="#065f46"/>
    <rect y="26" width="270" height="8" fill="#065f46"/>
    <text x="135" y="22" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
      3. TELEMETRÍA DEFENSIVA SOC/EDR Y REGLAS
    </text>

    <g transform="translate(14, 54)" font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">
      <text x="0" y="0" font-weight="bold" fill="#6ee7b7">&bull; Puntuación de Entropía de Shannon y Densidad de Carets</text>
      <text x="0" y="50" font-weight="bold" fill="#6ee7b7">&bull; Reglas Sigma: Slicing Sospechoso en Línea de Comandos</text>
      <text x="0" y="100" font-weight="bold" fill="#6ee7b7">&bull; Reglas YARA: Firmas de Ofuscador y Secciones PE</text>
      <text x="0" y="150" font-weight="bold" fill="#6ee7b7">&bull; MITRE ATT&amp;CK: T1059.003, T1027.010, T1140</text>
    </g>
  </g>
</svg>