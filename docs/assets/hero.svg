<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0c1324"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.38"/>
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Chassis -->
  <rect width="940" height="250" rx="14" fill="url(#bgGrad)"/>
  <rect width="940" height="250" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="938" height="248" rx="13" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Glowing Ambiance Orbs -->
  <circle cx="125" cy="125" r="85" fill="#10b981" opacity="0.12" filter="blur(40px)"/>
  <circle cx="820" cy="130" r="90" fill="#38bdf8" opacity="0.12" filter="blur(45px)"/>

  <!-- Left Ghidra Decompiler Hex Shield & AST Tree Diagram -->
  <g transform="translate(65, 58)">
    <polygon points="65,10 112,37 112,93 65,120 18,93 18,37" fill="#0b1324" stroke="#1e3a5f" stroke-width="2"/>
    <polygon points="65,10 112,37 112,93 65,120 18,93 18,37" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="26 12" filter="url(#neon-glow)"/>

    <!-- Tree Branches -->
    <line x1="65" y1="36" x2="40" y2="68" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="65" y1="36" x2="90" y2="68" stroke="#818cf8" stroke-width="1.8"/>
    <line x1="40" y1="68" x2="52" y2="96" stroke="#10b981" stroke-width="1.5"/>
    <line x1="90" y1="68" x2="78" y2="96" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Tree Nodes -->
    <circle cx="65" cy="36" r="6" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#neon-glow)"/>
    <circle cx="40" cy="68" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="90" cy="68" r="5" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="52" cy="96" r="4" fill="#10b981"/>
    <circle cx="78" cy="96" r="4" fill="#38bdf8"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(230, 44)">
    <!-- Top Chips -->
    <g>
      <rect x="0" y="0" width="180" height="24" rx="6" fill="#0f261e" stroke="#065f46" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#10b981" filter="url(#neon-glow)"/>
      <text x="22" y="15.5" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">GHIDRA MCP RE</text>

      <rect x="190" y="0" width="205" height="24" rx="6" fill="#0f1f2e" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="202" cy="12" r="3" fill="#38bdf8" filter="url(#neon-glow)"/>
      <text x="212" y="15.5" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">CMD.EXE 5-STAGE PARSER</text>

      <rect x="405" y="0" width="200" height="24" rx="6" fill="#1b1736" stroke="#4338ca" stroke-width="1"/>
      <circle cx="417" cy="12" r="3" fill="#818cf8" filter="url(#neon-glow)"/>
      <text x="427" y="15.5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">41+ OPEN-SOURCE REFS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="900" letter-spacing="-0.5">
      batch-forensics-and-ghidra-re
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600">
      Windows Batch Forensics, Parser Internals &amp; Binary Reverse Engineering Archive
    </text>

    <!-- Footer Specs -->
    <text x="0" y="139" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">
      Ghidra PE Dissections · 1990s–2026 Evolution · Static AST Deobfuscation · Sigma &amp; YARA Rules
    </text>
  </g>
</svg>