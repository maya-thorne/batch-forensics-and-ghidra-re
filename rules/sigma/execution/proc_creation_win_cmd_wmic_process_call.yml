title: WMIC Process Call Create Execution via Batch
id: c9d0e1f2-a3b4-5c6d-7e8f-9a0b1c2d3e4f
status: production
description: Detects batch scripts spawning processes indirectly via wmic process call create.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.execution
    - attack.t1047
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\wmic.exe'
    selection_args:
        CommandLine|contains|all:
            - 'process'
            - 'call'
            - 'create'
    condition: selection_img and selection_args
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
