title: Scheduled Task One-Time Immediate Batch Run
id: e1f2a3b4-c5d6-7e8f-9a0b-1c2d3e4f5a6b
status: production
description: Detects batch creating and immediately running one-time scheduled task (schtasks /create & /run).
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.execution
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_args:
        CommandLine|contains|all:
            - '/create'
            - '/ru'
            - 'system'
    condition: selection_img and selection_args
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
