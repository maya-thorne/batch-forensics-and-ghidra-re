title: Batch Dropping and Executing Script via Cscript
id: f6a7b8c9-d0e1-2f3a-4b5c-6d7e8f9a0b1c
status: production
description: Detects cmd.exe dropping temporary VBS/JS scripts and executing via cscript/wscript.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.execution
    - attack.t1059.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith: '\cmd.exe'
    selection_script:
        Image|endswith:
            - '\cscript.exe'
            - '\wscript.exe'
    condition: selection_parent and selection_script
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: medium
