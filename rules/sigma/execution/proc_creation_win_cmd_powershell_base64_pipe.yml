title: Cmd.exe Spawning Base64 Encoded PowerShell
id: e5f6a7b8-c9d0-1e2f-3a4b-5c6d7e8f9a0b
status: production
description: Detects cmd.exe child process launching PowerShell with encoded command flags (-enc, -encodedcommand).
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith: '\cmd.exe'
    selection_ps:
        Image|endswith: '\powershell.exe'
    selection_flags:
        CommandLine|contains:
            - ' -e '
            - ' -enc '
            - ' -EncodedCommand '
    condition: selection_parent and selection_ps and selection_flags
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
