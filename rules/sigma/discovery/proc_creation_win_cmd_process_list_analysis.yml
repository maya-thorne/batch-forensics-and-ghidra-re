title: Analysis Tools Process Scanning via Tasklist
id: d6e7f8a9-b0c1-2d3e-4f5a-6b7c8d9e0f1a
status: production
description: Detects tasklist scanning for debuggers and packet sniffers (x64dbg, wireshark, procmon).
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.discovery
    - attack.t1057
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith: '\cmd.exe'
    selection_proc:
        Image|endswith: '\tasklist.exe'
    condition: selection_parent and selection_proc
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
