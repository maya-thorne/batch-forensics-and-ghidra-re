title: Net Group Domain Admins Reconnaissance
id: a9b0c1d2-e3f4-5a6b-7c8d-9e0f1a2b3c4d
status: production
description: Detects net group querying Domain Admins or Enterprise Admins from batch.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.discovery
    - attack.t1069.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_args:
        CommandLine|contains|all:
            - 'group'
            - '/domain'
    condition: selection_img and selection_args
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
