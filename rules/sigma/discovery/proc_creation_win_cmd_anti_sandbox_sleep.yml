title: Anti-Sandbox Ping Evasion Delay in Batch
id: b4c5d6e7-f8a9-0b1c-2d3e-4f5a6b7c8d9e
status: production
description: Detects pinging localhost with high count (-n 20+) to induce synthetic execution delay.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.discovery
    - attack.t1497.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\ping.exe'
    selection_args:
        CommandLine|contains|all:
            - '127.0.0.1'
            - '-n '
    condition: selection_img and selection_args
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: medium
