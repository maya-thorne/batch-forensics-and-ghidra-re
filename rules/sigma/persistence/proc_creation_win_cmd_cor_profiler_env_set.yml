title: COR Profiler DLL Hijack Persistence Variable Set
id: c7d8e9f0-a1b2-3c4d-5e6f-7a8b9c0d1e2f
status: production
description: Detects setting COR_ENABLE_PROFILING or COR_PROFILER environment variables in batch.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.persistence
    - attack.t1574.012
logsource:
    category: process_creation
    product: windows
detection:
    selection_cmd:
        CommandLine|contains:
            - 'COR_ENABLE_PROFILING'
            - 'COR_PROFILER'
    condition: selection_cmd
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
