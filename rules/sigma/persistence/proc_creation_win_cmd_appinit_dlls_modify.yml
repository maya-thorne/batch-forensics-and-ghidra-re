title: AppInit_DLLs Registry Modification via Batch
id: d8e9f0a1-b2c3-4d5e-6f7a-8b9c0d1e2f3a
status: production
description: Detects reg.exe modifying Windows NT AppInit_DLLs registry value for global DLL injection.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.persistence
    - attack.t1546.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\reg.exe'
    selection_appinit:
        CommandLine|contains: 'AppInit_DLLs'
    condition: selection_img and selection_appinit
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: critical
