title: Cmd.exe Double Caret Escape Sequence Density
id: b1c2d3e4-5f6a-7b8c-9d0e-1f2a3b4c5d6e
status: production
description: Detects excessive consecutive double caret sequences (^^) used in nested batch layers to bypass single-pass deobfuscators.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_double_caret:
        CommandLine|contains: '^^^^'
    condition: selection_img and selection_double_caret
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: medium
