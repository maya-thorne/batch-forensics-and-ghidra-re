title: Somalifuscator Dynamic Caesar Shift Batch Execution
id: d5e6f7a8-9b0c-1d2e-3f4a-5b6c7d8e9f0a
status: production
description: Detects Somalifuscator V1/V2 execution patterns featuring randomized variable character mappings and dynamic Caesar loops.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_somali:
        CommandLine|contains:
            - 'somalifuscator'
            - 'somali_'
            - '%random%'
    condition: selection_img and selection_somali
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
