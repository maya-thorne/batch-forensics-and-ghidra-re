title: Pcalua Program Compatibility Assistant Abuse
id: e2f3a4b5-6c7d-8e9f-0a1b-2c3d4e5f6a7b
status: production
description: Detects pcalua.exe executing cmd.exe or scripts indirectly to evade parent process monitoring.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1202
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\pcalua.exe'
    selection_flag:
        CommandLine|contains:
            - '-a '
            - 'cmd.exe'
    condition: selection_img and selection_flag
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
