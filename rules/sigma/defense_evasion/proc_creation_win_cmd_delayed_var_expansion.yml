title: Suspicious Delayed Variable Exclamation Expansion Density
id: a6b7c8d9-0e1f-2a3b-4c5d-6e7f8a9b0c1d
status: production
description: Detects dense exclamation mark variable expansions (!VAR!) in command line execution, evading standard percent matching.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_excl:
        CommandLine|re: '(![a-zA-Z0-9_]+(!|:~)){3,}'
    condition: selection_img and selection_excl
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
