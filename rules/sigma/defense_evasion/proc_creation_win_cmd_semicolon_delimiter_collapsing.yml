title: Cmd.exe Semicolon Delimiter Obfuscation
id: c8d9e0f1-2a3b-4c5d-6e7f-8a9b0c1d2e3f
status: production
description: Detects unquoted semicolons separating command arguments in place of standard whitespace.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_semi:
        CommandLine|contains:
            - 'cmd.exe;/c'
            - 'cmd.exe;/k'
            - 'cmd;/c'
    condition: selection_img and selection_semi
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
