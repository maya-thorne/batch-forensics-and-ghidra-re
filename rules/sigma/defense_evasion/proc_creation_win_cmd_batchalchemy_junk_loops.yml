title: BatchAlchemy Mutated AST Obfuscation
id: a8b9c0d1-2e3f-4a5b-6c7d-8e9f0a1b2c3d
status: production
description: Detects BatchAlchemy tree-sitter mutated batch files with synthetic dead code blocks and arithmetic padding.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_alchemy:
        CommandLine|contains:
            - 'batchalchemy'
            - 'set /a '
    condition: selection_img and selection_alchemy
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: medium
