title: Abobus Obfuscator Dead Code Jump Chain
id: f7a8b9c0-1d2e-3f4a-5b6c-7d8e9f0a1b2c
status: production
description: Detects Abobus batch obfuscator structures containing dense random labels and goto jump chains.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_abobus:
        CommandLine|contains:
            - 'abobus'
            - ':label_'
    condition: selection_img and selection_abobus
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: medium
