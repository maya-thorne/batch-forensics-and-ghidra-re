title: ScrubCrypt Batch Loader Stage 1 Bootstrap
id: c4d5e6f7-8a9b-0c1d-2e3f-4a5b6c7d8e9f
status: production
description: Detects ScrubCrypt multi-stage loader extracting encrypted payload markers from batch comments.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027
    - attack.execution
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_scrub:
        CommandLine|contains|all:
            - 'findstr'
            - 'certutil'
            - 'powershell'
    condition: selection_img and selection_scrub
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: critical
