title: Rundll32 Indirect Launch of Batch Script
id: f3a4b5c6-7d8e-9f0a-1b2c-3d4e5f6a7b8c
status: production
description: Detects rundll32.exe launching batch scripts via url.dll or shell32.dll file protocol handlers.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\rundll32.exe'
    selection_args:
        CommandLine|contains:
            - 'FileProtocolHandler'
            - '.bat'
            - '.cmd'
    condition: selection_img and selection_args
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
