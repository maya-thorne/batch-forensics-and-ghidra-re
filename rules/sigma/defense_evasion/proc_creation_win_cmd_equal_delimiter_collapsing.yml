title: Cmd.exe Equals Sign Delimiter Substitution
id: d9e0f1a2-3b4c-5d6e-7f8a-9b0c1d2e3f4a
status: production
description: Detects equals signs (=) used as argument separators in cmd.exe execution.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_eq:
        CommandLine|contains:
            - 'cmd.exe=/c'
            - 'cmd=/c'
            - 'cmd.exe==/c'
    condition: selection_img and selection_eq
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
