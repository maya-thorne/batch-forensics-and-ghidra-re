title: Cmd.exe Comma Delimiter Obfuscation
id: b7c8d9e0-1f2a-3b4c-5d6e-7f8a9b0c1d2e
status: production
description: Detects unquoted comma delimiters used in place of spaces to bypass naive argument tokenizers (e.g. cmd,/c,powershell).
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_comma:
        CommandLine|contains:
            - 'cmd.exe,/c'
            - 'cmd.exe,/k'
            - 'cmd,/c'
            - 'cmd.exe,,/c'
    condition: selection_img and selection_comma
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: high
