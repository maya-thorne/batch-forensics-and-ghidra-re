title: BatCloak UTF-16LE BOM Script Execution
id: b3c4d5e6-7f8a-9b0c-1d2e-3f4a5b6c7d8e
status: production
description: Detects execution of batch scripts exhibiting BatCloak / BEncoder polyglot markers bypassing EDR file inspection.
references:
    - https://github.com/maya-thorne/batch-forensics-and-ghidra-re
author: Maya Thorne (Detection Engineering)
date: 2026-10-11
modified: 2026-10-11
tags:
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\cmd.exe'
    selection_args:
        CommandLine|contains:
            - 'batcloak'
            - 'scrubcrypt'
            - 'bencoder'
    condition: selection_img and selection_args
falsepositives:
    - Highly complex legacy IT maintenance or software deployment scripts (infrequent)
level: critical
